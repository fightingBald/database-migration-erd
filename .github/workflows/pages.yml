name: Publish project website

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Fetch versioned illustration assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'layout-*' --pattern SHA256SUMS --dir site/assets
          (cd site/assets && sha256sum --check --ignore-missing SHA256SUMS)
          test -s site/assets/layout-after.svg
          test -s site/assets/layout-before.svg
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
