[tool.pytest.ini_options]
testpaths = ["erd_generator", "tests"]
markers = ["integration: requires the pinned D2 executable"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Keep formatting changes out of the existing SQL parser and schema model.
[tool.ruff.format]
exclude = ["erd_generator/sql_parser.py", "erd_generator/schema.py"]
